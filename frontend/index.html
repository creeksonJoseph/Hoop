<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="canonical" href="https://hooop.tech/" />

    <title>Hooop</title>
    <meta
      name="description"
      content="Let your hb/hg help you out when you are out of words in that DM."
    />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hooop" />
    <meta property="og:title" content="Hooop" />
    <meta
      property="og:description"
      content="Let your hb/hg help you out when you are out of words in that DM."
    />
    <meta property="og:url" content="https://hooop.tech/" />
    <meta property="og:image" content="https://hooop.tech/pwa-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Hooop Logo" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Hooop" />
    <meta
      name="twitter:description"
      content="Let your hb/hg help you out when you are out of words in that DM."
    />
    <meta name="twitter:image" content="https://hooop.tech/pwa-512x512.png" />

    <!-- Mobile & PWA Theme -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191918" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hooop" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <!-- JSON-LD Structured Data: WebApplication & FAQPage -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "@id": "https://hooop.tech/#webapp",
            "name": "Hooop",
            "url": "https://hooop.tech/",
            "applicationCategory": "CommunicationApplication",
            "operatingSystem": "All",
            "description": "Real-time collaborative co-op workstation for Instagram direct messages.",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            }
          },
          {
            "@type": "Organization",
            "@id": "https://hooop.tech/#organization",
            "name": "Hooop",
            "url": "https://hooop.tech/",
            "logo": "https://hooop.tech/favicon.svg"
          },
          {
            "@type": "FAQPage",
            "@id": "https://hooop.tech/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Does the other person know my wingman is typing?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. The recipient only sees messages coming directly from your regular Instagram account. Hooop does not add badges, signatures, or metadata to outgoing messages."
                }
              },
              {
                "@type": "Question",
                "name": "Does my friend have to install anything?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Not at all. You generate an invite link and send it via text or WhatsApp. They open the link in any mobile or desktop web browser and immediately enter co-op mode."
                }
              },
              {
                "@type": "Question",
                "name": "Can my wingman read all my other conversations?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Absolutely not. Access is sandboxed on a strict, per-thread basis. When you invite a wingman, they only gain view and reply permissions for the exact thread you selected."
                }
              },
              {
                "@type": "Question",
                "name": "How do I end the wingman session?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "You can click the Revoke Access button inside your Hooop dashboard at any moment. Your friend's session instantly terminates and they are redirected to a closed screen."
                }
              }
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
