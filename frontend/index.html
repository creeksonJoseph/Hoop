    <noscript>
      <main
        style="

        <h1>Hooop  -  your Instagram DM wingman</h1>
        <p>
          When you run out of words in an Instagram DM, Hooop lets a trusted
          friend step in and help you reply. No password sharing, no app install,
          and no screenshots.
        </p>
        <h2>How Hooop works</h2>
        <ol>
          <li>Connect your Instagram account securely.</li>
          <li>Pick the one DM thread you want help with and share an invite link.</li>
          <li>
            Your wingman opens the link in any browser and helps you reply in
            real time.
          </li>
        </ol>
        <h2>Private by design</h2>
        <p>
          A wingman only sees the exact thread you invite them into. You can
          revoke their access at any time.
        </p>
        <h2>Frequently asked questions</h2>
        <h3>Does the other person know my wingman is typing?</h3>
        <p>
          No. The recipient only sees messages coming directly from your regular
          Instagram account. Hooop does not add badges, signatures, or metadata
          to outgoing messages.
        </p>
        <h3>Does my friend have to install anything?</h3>
        <p>
          Not at all. You generate an invite link and send it via text or
          WhatsApp. They open the link in any mobile or desktop web browser and
          immediately enter co-op mode.
        </p>
        <h3>Can my wingman read all my other conversations?</h3>
        <p>
          Absolutely not. Access is sandboxed on a strict, per-thread basis.
          When you invite a wingman, they only gain view and reply permissions
          for the exact thread you selected.
        </p>
        <h3>How do I end the wingman session?</h3>
        <p>
          You can click the “Revoke Access” button inside your Hooop dashboard
          at any moment. Your friend's session instantly terminates and they
          are redirected to a closed screen.
        </p>
        <p>
          <a href="https://hooop.tech/privacy">Privacy and policies</a>
        </p>
      </main>
