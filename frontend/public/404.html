<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Page not found  -  Hooop</title>
    <meta
      name="description"
      content="The page you were looking for could not be found. Head back to Hooop."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f9f9f8" />
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
        background: #f9f9f8;
        color: #191918;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system,
          "Segoe UI", sans-serif;
        line-height: 1.6;
      }

      main {
        width: 100%;
        max-width: 34rem;
        text-align: center;
      }

      .logo {
        display: inline-flex;
        width: 3rem;
        height: 3rem;
        align-items: center;
        justify-content: center;
        border-radius: 0.75rem;
        background: #191918;
        color: #fff;
        font-size: 1.25rem;
        font-weight: 700;
      }

      .eyebrow {
        margin: 2rem 0 0;
        color: #0075de;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0.75rem 0 0;
        font-size: clamp(2rem, 6vw, 2.75rem);
        line-height: 1.1;
        letter-spacing: -0.02em;
      }

      p {
        margin: 1rem auto 0;
        max-width: 28rem;
        color: #615d59;
        font-size: 0.95rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 2rem;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        padding: 0 1.5rem;
        border-radius: 999px;
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
        transition: background-color 0.15s ease;
      }

      .primary {
        background: #191918;
        color: #fff;
      }

      .primary:hover {
        background: #2b2a28;
      }

      .secondary {
        border: 1px solid #dfdcd9;
        background: #fff;
        color: #191918;
      }

      .secondary:hover {
        background: #f0eeec;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="logo" aria-hidden="true">H</span>
      <p class="eyebrow">404</p>
      <h1>This page went off the grid</h1>
      <p>
        The link may be broken, or the page may have moved. Head back to the
        homepage and keep the conversation going.
      </p>
      <div class="actions">
        <a class="primary" href="/">Back to Hooop</a>
        <a class="secondary" href="/privacy">Privacy policy</a>
      </div>
    </main>
  </body>
</html>
