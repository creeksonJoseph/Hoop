        <h1>Hooop privacy and data policy</h1>
        <p>
          Hooop only accesses the Instagram Direct Message threads you choose to
          share. Your wingman can only see and reply to the specific thread you
          invite them into.
        </p>
        <h2>What we collect</h2>
        <p>
          When you connect Instagram, Hooop accesses the Direct Messages,
          usernames, and profile pictures needed for the conversations you
          choose to share.
        </p>
        <h2>Who sees your data</h2>
        <p>
          Only the wingmen you explicitly invite can read the shared thread or
          send messages on your behalf.
        </p>
        <h2>How to delete your data</h2>
        <p>
          Open Settings in the Hooop dashboard, go to the Danger Zone, and select
          “Disconnect API Key &amp; Delete Data”. This removes your synced
          conversations, messages, and profile pictures from our database.
        </p>
        <p><a href="https://hooop.tech/">Return to Hooop</a></p>
      </main>
