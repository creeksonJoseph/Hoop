    <style>
        body {
            background-color: theme('colors.surface');
            color: theme('colors.on-surface');
            -webkit-font-smoothing: antialiased;
        }

        .ambient-glow {
            position: relative;
        }

        .ambient-glow::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: calc(100% + 40px);
            height: calc(100% + 40px);
            background: radial-gradient(circle, theme('colors.primary/0.15') 0%, transparent 70%);
            z-index: -1;
            border-radius: inherit;
            pointer-events: none;
        }

        .glass-card {
            background: theme('colors.secondary-container/0.8');
            backdrop-filter: blur(20px);
            border: 1px solid theme('colors.white/0.05');
        }

        .active-edge {
            border: 1px solid theme('colors.primary/0.2');
        }
    </style>

<body class="bg-surface text-on-surface font-body-md h-screen flex flex-col overflow-hidden">
    <!-- TopAppBar -->
    <header
        class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl border-b border-primary/10 shadow-sm transition-all duration-300 ease-in-out flex items-center justify-between px-container-padding h-16">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center overflow-hidden">
                <img class="w-full h-full object-cover"
                    data-alt="A macro shot of a sleek, abstract metallic orb glowing with a warm amber light in a dark obsidian void. The lighting is cinematic, highlighting the smooth, premium texture of the metal. The mood is mysterious and technological."
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuBaXTnhDCJwB5IqK-BpcX5C3xeo3TcSUXEltEYMd5cihUSlA-hMfCGBfL8JgA_7aA8g4fUtGib8E4HJsfJX13zRbzdBrLa9E2HhoEh_fqwJ_uXrLz7SHN9JORKV4c8kqVDh3eh2EVpMtWXxFcON5StJ6TqAXX8YI9-N1AZJE2gFw3NNNJ9-HUZs44wk25XCE4eV0OyvktEg2vv_hqgCAvk5F-QQHH2kX7t32x3EL_4ZNRM0-d9EEGNJ" />
            </div>
            <span class="font-headline-md text-headline-md font-medium text-primary">Hoop</span>
        </div>
        <button class="text-on-surface-variant hover:opacity-80 transition-all duration-300 ease-in-out">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">bolt</span>
        </button>
    </header>
    <!-- Main Content Canvas -->
    <main class="flex-1 overflow-y-auto pt-24 pb-32 px-container-padding">
        <div class="mb-stack-lg">
            <h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Settings</h1>
            <p class="font-body-md text-body-md text-on-surface-variant">Manage your Hoop workspace preferences.</p>
        </div>
        <!-- Navigation List -->
        <div class="glass-card rounded-lg p-2 mb-stack-md flex flex-col gap-1">
            <button
                class="w-full flex items-center justify-between p-3 rounded-DEFAULT hover:bg-white/5 transition-colors">
                <div class="flex items-center gap-3">
                    <span class="material-symbols-outlined text-on-surface-variant">person</span>
                    <span class="font-label-md text-label-md text-on-surface">Account Profile</span>
                </div>
                <span class="material-symbols-outlined text-on-surface-variant text-sm">chevron_right</span>
            </button>
            <button
                class="w-full flex items-center justify-between p-3 rounded-DEFAULT hover:bg-white/5 transition-colors">
                <div class="flex items-center gap-3">
                    <span class="material-symbols-outlined text-on-surface-variant">group</span>
                    <span class="font-label-md text-label-md text-on-surface">Team</span>
                </div>
                <span class="material-symbols-outlined text-on-surface-variant text-sm">chevron_right</span>
            </button>
            <button
                class="w-full flex items-center justify-between p-3 rounded-DEFAULT hover:bg-white/5 transition-colors">
                <div class="flex items-center gap-3">
                    <span class="material-symbols-outlined text-on-surface-variant">extension</span>
                    <span class="font-label-md text-label-md text-on-surface">Integrations</span>
                </div>
                <span class="material-symbols-outlined text-on-surface-variant text-sm">chevron_right</span>
            </button>
            <button
                class="w-full flex items-center justify-between p-3 rounded-DEFAULT hover:bg-white/5 transition-colors">
                <div class="flex items-center gap-3">
                    <span class="material-symbols-outlined text-on-surface-variant">credit_card</span>
                    <span class="font-label-md text-label-md text-on-surface">Billing</span>
                </div>
                <span class="material-symbols-outlined text-on-surface-variant text-sm">chevron_right</span>
            </button>
        </div>
        <!-- Zernio Connection Section (Focus Detail) -->
        <h2 class="font-label-md text-label-md text-primary mb-3 pl-2">Zernio Integration</h2>
        <div class="glass-card active-edge rounded-xl p-container-padding mb-stack-md ambient-glow">
            <div class="flex items-start justify-between mb-stack-sm">
                <div class="flex items-center gap-3">
                    <div
                        class="w-10 h-10 rounded-DEFAULT bg-surface-container-high flex items-center justify-center border border-primary/20">
                        <span class="material-symbols-outlined text-primary"
                            style="font-variation-settings: 'FILL' 1;">hub</span>
                    </div>
                    <div>
                        <h3 class="font-label-md text-label-md text-on-surface">Zernio Connection</h3>
                        <p class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1 mt-1">
                            <span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
                            Active &amp; Syncing
                        </p>
                    </div>
                </div>
                <span
                    class="px-2 py-1 bg-tertiary-container/20 text-tertiary-container rounded-full font-label-sm text-label-sm border border-tertiary-container/30">Primary</span>
            </div>
            <!-- API Key Masking -->
            <div
                class="bg-surface-container-low rounded-DEFAULT p-3 mb-stack-sm border-b border-primary/20 focus-within:border-primary transition-colors flex items-center justify-between">
                <div>
                    <label class="block font-label-sm text-label-sm text-on-surface-variant mb-1">API Key</label>
                    <div class="font-body-md text-body-md text-on-surface font-mono tracking-widest">
                        zr_live_••••••••••••8x9q
                    </div>
                </div>
                <button class="p-2 rounded-full hover:bg-white/10 transition-colors text-on-surface-variant">
                    <span class="material-symbols-outlined text-sm">content_copy</span>
                </button>
            </div>
            <div class="flex gap-3">
                <button
                    class="flex-1 py-2 px-4 rounded-full border border-primary text-primary font-label-md text-label-md hover:bg-primary/10 transition-colors text-center">
                    Rotate Key
                </button>
                <button
                    class="flex-1 py-2 px-4 rounded-full bg-primary text-on-primary font-label-md text-label-md hover:opacity-90 transition-opacity text-center shadow-[0_0_15px_rgba(255,225,158,0.3)]">
                    Test Latency
                </button>
            </div>
        </div>
        <div class="glass-card rounded-lg p-2 mb-stack-lg">
            <button
                class="w-full flex items-center justify-between p-3 rounded-DEFAULT hover:bg-white/5 transition-colors">
                <div class="flex items-center gap-3">
                    <span class="material-symbols-outlined text-on-surface-variant">shield</span>
                    <span class="font-label-md text-label-md text-on-surface">AWS Roles</span>
                </div>
                <span class="material-symbols-outlined text-on-surface-variant text-sm">chevron_right</span>
            </button>
        </div>
    </main>
    <!-- BottomNavBar -->
    <nav
        class="fixed bottom-0 w-full z-50 rounded-t-lg bg-surface/90 backdrop-blur-2xl border-t border-white/5 shadow-[0_-4px_24px_rgba(0,0,0,0.5)] flex justify-around items-center h-20 px-4 pb-safe hidden md:hidden flex">

            href="#">
            <span class="material-symbols-outlined mb-1">chat_bubble</span>
            <span class="font-label-sm text-label-sm">Inbox</span>
        </a>
        <a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary-fixed-dim active:scale-95 transition-transform duration-200 w-16"
            href="#">
            <span class="material-symbols-outlined mb-1">equalizer</span>
            <span class="font-label-sm text-label-sm">Analytics</span>
        </a>
        <a class="flex flex-col items-center justify-center text-primary font-bold bg-secondary-container/30 rounded-xl px-4 py-1 hover:text-primary-fixed-dim active:scale-95 transition-transform duration-200"
            href="#">
            <span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">settings</span>
            <span class="font-label-sm text-label-sm">Settings</span>
        </a>
        <a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary-fixed-dim active:scale-95 transition-transform duration-200 w-16"
            href="#">
            <span class="material-symbols-outlined mb-1">person</span>
            <span class="font-label-sm text-label-sm">Profile</span>
        </a>
    </nav>
    <!-- Desktop Sidebar mapping for context, hidden on mobile -->
    <nav
        class="hidden md:flex fixed left-0 top-0 h-full w-64 bg-surface/90 border-r border-white/5 p-4 flex-col gap-4 pt-24 z-40">
        <!-- Desktop Nav Items would go here, omitting for mobile focus as requested, but keeping structural shell intent clear -->
    </nav>
</body>

</html>
