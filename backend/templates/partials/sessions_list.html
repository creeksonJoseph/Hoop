{# HTMX fragment: full sessions list for /sessions/:ig_username/list #}
{% if not sessions %}
<div class="text-center py-20 fade-up" id="sessions-list">
  <div class="text-5xl mb-4">🔗</div>
  <h2 class="text-lg font-semibold text-white mb-2">No wingman links yet</h2>
  <p class="text-muted text-sm mb-6">Generate a shareable link to give someone access to this conversation</p>
  <button onclick="document.getElementById('gen-modal').classList.remove('hidden')"
    class="bg-gradient-to-r from-accent to-bubble-out text-white text-sm font-semibold px-6 py-2.5 rounded-sm2 hover:opacity-90 transition-all">
    Generate first link
  </button>
</div>
{% else %}
<div class="space-y-3" id="sessions-list">
  {% for s in sessions %}
  {% include "partials/session_card.html" %}
  {% endfor %}
</div>
{% endif %}
