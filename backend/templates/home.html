{% extends "base.html" %}
{% block title %}My DMs · Hoop{% endblock %}

{% block content %}
<div class="min-h-screen bg-bg">

  <!-- Top nav -->
  <header class="sticky top-0 z-30 bg-surface/80 backdrop-blur border-b border-border px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-accent to-bubble-out flex items-center justify-center text-xl">🏀</div>
      <div>
        <h1 class="text-sm font-bold text-white">Hoop</h1>
        <p class="text-xs text-muted">{{ user.email }}</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <!-- Add DM button -->
      <button onclick="document.getElementById('add-dm-modal').classList.remove('hidden')"
        class="flex items-center gap-2 bg-accent/20 hover:bg-accent/30 border border-accent/40 text-accent
               px-3 py-1.5 rounded-sm2 text-xs font-semibold transition-all">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        Add DM
      </button>
      <!-- Logout -->
      <form method="POST" action="/auth/logout">
        <button class="text-muted hover:text-white text-xs px-3 py-1.5 rounded-sm2 transition-colors border border-transparent hover:border-border">
          Sign Out
        </button>
      </form>
    </div>
  </header>

  <!-- DM List — skeleton shown immediately, real content swapped in -->
  <main class="max-w-2xl mx-auto px-4 py-8">
    <div
      id="dm-list"
      hx-get="/home/dms"
      hx-trigger="load"
      hx-swap="outerHTML"
      hx-sync="this:drop"
    >
      {% include "partials/skeletons/dm_list_skeleton.html" %}
    </div>
  </main>
</div>

<!-- Add DM Modal -->
<div id="add-dm-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center px-4 bg-black/60 backdrop-blur-sm">
  <div class="bg-surface border border-border rounded-xl2 p-6 w-full max-w-sm shadow-card fade-up">
    <h2 class="text-base font-bold text-white mb-1">Add a DM conversation</h2>
    <p class="text-muted text-xs mb-5">Enter the Instagram username of the person you're chatting with</p>
    <form hx-post="/home/add-dm" hx-target="#dm-list" hx-swap="outerHTML"
          hx-on::after-request="if(event.detail.successful) document.getElementById('add-dm-modal').classList.add('hidden')"
          class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-white mb-1.5" for="ig_username">Instagram Username</label>
        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-muted text-sm">@</span>
          <input id="ig_username" name="ig_username" type="text" required
            placeholder="username"
            class="w-full bg-bg border border-border rounded-sm2 pl-8 pr-4 py-2.5 text-sm text-white placeholder-muted
                   focus:outline-none focus:border-accent transition-colors" />
        </div>
      </div>
      <div class="flex gap-3">
        <button type="button" onclick="document.getElementById('add-dm-modal').classList.add('hidden')"
          class="flex-1 bg-surface2 text-muted hover:text-white border border-border py-2.5 rounded-sm2 text-sm transition-all">
          Cancel
        </button>
        <button type="submit"
          class="flex-1 bg-gradient-to-r from-accent to-bubble-out text-white font-semibold py-2.5 rounded-sm2 text-sm
                 hover:opacity-90 active:scale-95 transition-all">
          Add <span class="htmx-indicator">⏳</span>
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
